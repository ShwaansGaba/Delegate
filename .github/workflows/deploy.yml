name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://znhbotfzmmrsibazlraw.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_aAKyRRw9WOv5m8zy1X6aVg_OPj0RZTL"
        run: npm run build

      - name: Prevent Jekyll from skipping Next.js folders
        run: touch ./out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages (Actions mode fallback)
        continue-on-error: true
        uses: actions/deploy-pages@v4
